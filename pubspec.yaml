name: geo_route_finder
description: >-
  High-performance, data-source-agnostic, offline-first routing engine in pure
  Dart. Pluggable map data sources (OpenStreetMap included) and storage
  backends, with A*, Dijkstra and Contraction Hierarchies routers.
version: 1.0.0
repository: https://github.com/gmpassos/geo_route_finder

environment:
  sdk: ^3.10.9

dependencies:
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
  dependency_validator: ^5.0.5
